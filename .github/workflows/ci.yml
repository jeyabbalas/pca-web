name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Build before test: the worker-parity suite includes a dist
      # import-graph check that is skipped when dist/ is absent.
      - run: npm run build
      - run: npm test
      - run: npm run demo:build

  # Real-browser suites (Playwright Chromium). The worker suite needs no
  # GPU and is required; the GPU suite (SwiftShader on CI runners) is
  # advisory because headless-GPU availability varies across runner images.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:browser:worker
      # Exit 2 means no usable WebGPU adapter in this environment (the run's
      # own report says what could not execute) — tolerated with a warning;
      # real test failures (exit 1) turn the step red, but stay advisory.
      - continue-on-error: true
        run: |
          npm run test:browser || {
            code=$?
            if [ "$code" -eq 2 ]; then
              echo "::warning::GPU suite not executable on this runner (no WebGPU adapter)"
            else
              exit "$code"
            fi
          }
